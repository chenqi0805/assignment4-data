name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cache classifier models
        uses: actions/cache@v4
        with:
          path: local-shared-data/classifiers
          key: classifier-models-v1

      - name: Download classifier models
        # Same public assets scripts/download_data.py --offline-only fetches (~2.1 GB).
        run: |
          mkdir -p local-shared-data/classifiers
          curl -sSL -o local-shared-data/classifiers/lid.176.bin \
            https://dl.fbaipublicfiles.com/fasttext/supervised-models/lid.176.bin
          curl -sSL -o local-shared-data/classifiers/dolma_fasttext_nsfw_jigsaw_model.bin \
            https://huggingface.co/allenai/dolma-jigsaw-fasttext-bigrams-nsfw/resolve/main/model.bin
          curl -sSL -o local-shared-data/classifiers/dolma_fasttext_hatespeech_jigsaw_model.bin \
            https://huggingface.co/allenai/dolma-jigsaw-fasttext-bigrams-hatespeech/resolve/main/model.bin

      - name: Run tests
        # tests/test_quality.py::test_classify_quality needs quality_classifier.bin,
        # which scripts/train_quality_classifier.py trains locally and repo policy
        # keeps out of git — that one test can only run where the model exists.
        run: uv run pytest ./tests -q --deselect tests/test_quality.py::test_classify_quality

      - name: Lint
        run: uv run ruff check .
